<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ title }}</title>
  <link rel="icon" type="{{ logo_type }}" href="{{ logo_path }}">
  <link rel="stylesheet" href="/static/site.css?v=20261003-logo">
  <link rel="stylesheet" href="/static/admin.css?v=20261002-responsive">
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="shell admin-header-inner">
      <a class="brand" href="/admin">
        <img class="brand-logo" src="{{ logo_path }}" alt="" width="52" height="52">
        <span class="brand-name">BLACK METAL BUDDHA · ADMIN</span>
      </a>
      <nav class="admin-nav" aria-label="Admin navigation">
        <a href="/admin">Dashboard</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/catalog">Catalog</a>
        <a href="/admin/audit">Audit</a>
        <a href="/">Public site</a>
      </nav>
    </div>
  </header>
  <main class="shell admin-main">
    {% if message %}<div class="admin-message" role="status">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="shell admin-footer">Authenticated as {{ actor }} · Black Metal Buddha operations</footer>
</body>
</html>
