[project]
name = "black-metal-buddha"
version = "0.2.0"
description = "Black Metal Buddha self-hosted storefront"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.9,<1",
  "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
