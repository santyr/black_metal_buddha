name: rebuild approved logo
# transport order corrected; skip duplicated 04.part

on:
  push:
    branches:
      - brand/fix-logo-truncation
    paths:
      - ".github/workflows/rebuild-approved-logo.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Rebuild logo from transport-safe payload
        run: |
          mkdir -p app/static/brand
          cat tools/logo_payload/00.part tools/logo_payload/01.part tools/logo_payload/02.part tools/logo_payload/03.part tools/logo_payload/05.part | base64 --decode > app/static/brand/black-metal-buddha-logo.webp
      - name: Validate exact remote asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct
          from PIL import Image

          path = Path("app/static/brand/black-metal-buddha-logo.webp")
          data = path.read_bytes()
          assert len(data) == 13334, len(data)
          assert data[:4] == b"RIFF"
          assert data[8:12] == b"WEBP"
          declared = struct.unpack("<I", data[4:8])[0] + 8
          assert declared == len(data), (declared, len(data))
          assert hashlib.sha256(data).hexdigest() == "6e73625e42533c906a777b18056b98a34e84697983ee181f6f395d4427c4614a"
          with Image.open(path) as image:
              image.load()
              assert image.size == (384, 384)
              assert image.format == "WEBP"
          print("verified", len(data), image.size)
          PY
      - name: Commit rebuilt binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/brand/black-metal-buddha-logo.webp
          if git diff --cached --quiet; then
            echo "Logo already matches."
          else
            git commit -m "Rebuild valid Black Metal Buddha WebP logo"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
