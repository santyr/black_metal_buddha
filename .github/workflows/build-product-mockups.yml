name: build product mockups

on:
  push:
    branches:
      - product/mockups-printful-placement
    paths:
      - "tools/build_product_mockups.py"
      - "tools/mockup_assets/black-shirt-charcoal.svg"
      - ".github/workflows/build-product-mockups.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow cairosvg
      - run: python tools/build_product_mockups.py
      - name: Validate mockups
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          slugs = [
              "lotus-of-the-void",
              "dharma-of-decay",
              "meditate-on-death",
              "longchenpa-rest-in-illusion",
          ]
          for slug in slugs:
              path = Path("app/static/products") / f"{slug}.webp"
              assert path.exists() and path.stat().st_size > 5000, path
              with Image.open(path) as im:
                  im.load()
                  assert im.format == "WEBP"
                  assert im.size == (640, 640)
          PY
      - name: Commit generated storefront mockups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/products
          if git diff --cached --quiet; then
            echo "Mockups already current."
          else
            git commit -m "Generate Printful-sized product T-shirt mockups"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
